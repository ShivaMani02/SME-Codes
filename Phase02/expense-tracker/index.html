<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="app-header">
        <div class="container">
            <div class="brand" aria-label="Expense tracker brand">
                <span class="brand-icon" aria-hidden="true">💰</span>
                <div class="brand-copy">
                    <h1>Personal Expense Tracker</h1>
                    <p>Track your expenses and manage your budget effectively.</p>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        <!-- Section 1: Balance summary cards -> Total Balance, Total Income, Total Expenses -->
        <section class="balance-summary">
            <div class="card total-balance">
                <h2>Total Balance</h2>
                <p id="total-balance">₹0.00</p>
            </div>
            <div class="card total-income">
                <h2>Total Income</h2>
                <p id="total-income">₹0.00</p>
            </div>
            <div class="card total-expenses">
                <h2>Total Expenses</h2>
                <p id="total-expenses">₹0.00</p>
            </div>
        </section>

        <!-- Section 2: Expense form -> Input fields for expense name, amount, category, and date, along with a submit button -->
        <section class="expense-form">
            <h2>Add New Expense</h2>
            <form id="expense-form">
                <div class="form-group">
                    <label for="expense-name">Expense Name</label>
                    <input type="text" id="expense-name" name="expense-name" required>
                </div>
                <div class="form-group">
                    <label for="expense-amount">Amount</label>
                    <input type="number" id="expense-amount" name="expense-amount" required>
                </div>
                <div class="form-group">
                    <label for="expense-type">Type</label>
                    <select id="expense-type" name="expense-type" required>
                        <option value="">Select Type</option>
                        <option value="Income">Income</option>
                        <option value="Expense">Expense</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="expense-category">Category</label>
                    <select id="expense-category" name="expense-category" required>
                        <option value="">Select Category</option>
                        <option value="Food">🍔 Food</option>
                        <option value="Transport">🚗 Transport</option>
                        <option value="Entertainment">🎉 Entertainment</option>
                        <option value="Utilities">💡 Utilities</option>
                        <option value="Other">🧾 Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="expense-date">Date</label>
                    <input type="date" id="expense-date" name="expense-date" required>
                </div>
                <button type="submit">Add Expense</button>
            </form>
        </section>

        <!-- Section 3: Expense list -> Display a list of recorded expenses with details and options to -->
        <section class="expense-list">
            <div class="list-header">
                <h2>Expense List</h2>
                <div class="filter-group">
                    <label for="expense-filter">Filter</label>
                    <select id="expense-filter">
                        <option value="All">All</option>
                        <option value="Income">Income</option>
                        <option value="Expense">Expense</option>
                    </select>
                </div>
            </div>
            <ul id="expense-list">
                <!-- Expense items will be dynamically added here -->
            </ul>
        </section>
    </main>

    <script type="module" src="js/app.js"></script>
</body>

</html>
