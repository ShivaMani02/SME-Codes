<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DOM Form Validation</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      background: linear-gradient(135deg, #f8f9fa, #e9f2ff);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 15px;
    }

    .card {
      border: none;
      border-radius: 18px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
    }

    .form-control:focus,
    .form-select:focus {
      border-color: #86b7fe;
      box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.15);
    }

    .alert {
      min-height: 48px;
      display: flex;
      align-items: center;
    }

    .invalid {
      border-color: #dc3545 !important;
      background-color: #fff5f5;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="card p-4 p-md-5">
          <h2 class="text-center mb-4">Registration Form</h2>

          <div id="message" class="alert d-none" role="alert"></div>

          <form id="studentForm" novalidate>
            <div class="mb-3">
              <label for="name" class="form-label">Full Name</label>
              <input type="text" class="form-control" id="name" placeholder="Enter your full name" />
            </div>

            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input type="email" class="form-control" id="email" placeholder="Enter your email" />
            </div>

            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input type="password" class="form-control" id="password" placeholder="Minimum 8 characters" />
            </div>

            <div class="mb-3">
              <label for="confirmPassword" class="form-label">Confirm Password</label>
              <input type="password" class="form-control" id="confirmPassword" placeholder="Re-enter password" />
            </div>

            <button type="submit" class="btn btn-primary w-100">Submit</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('studentForm');
    const messageBox = document.getElementById('message');

    function showMessage(text, type) {
      messageBox.textContent = text;
      messageBox.classList.remove('d-none', 'alert-success', 'alert-danger');
      messageBox.classList.add(type === 'success' ? 'alert-success' : 'alert-danger');
    }

    function setFieldError(fieldId, isError) {
      const field = document.getElementById(fieldId);
      field.classList.toggle('invalid', isError);
    }

    form.addEventListener('submit', function (event) {
      event.preventDefault();

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

      let valid = true;

      setFieldError('name', false);
      setFieldError('email', false);
      setFieldError('password', false);
      setFieldError('confirmPassword', false);

      if (name === '') {
        setFieldError('name', true);
        valid = false;
      }

      if (email === '' || !emailPattern.test(email)) {
        setFieldError('email', true);
        valid = false;
      }

      if (password.length < 8) {
        setFieldError('password', true);
        valid = false;
      }

      if (confirmPassword === '' || confirmPassword !== password) {
        setFieldError('confirmPassword', true);
        valid = false;
      }

      if (!valid) {
        showMessage('Please correct the highlighted fields.', 'error');
        return;
      }

      showMessage('Registration successful! Form submitted.', 'success');
      form.reset();
    });
  </script>
</body>
</html>
