<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // user ---> 03/29 (MM/YY)  --> Print in Jan, Feb
        // HW --> Year === 2020-2030 Range String
        let month = 3;
        let year = 29;
        let result;
        switch(month) {
            case 1:
                result = "January, 20" + year;
                break;
            case 2:
                result = "February, 20" + year;
                break;
            case 3:
                result = "March, 20" + year;
                break;
            case 4:
                result = "April, 20" + year;
                break;
            case 5:
                result = "May, 20" + year;
                break;
            case 6:
                result = "June, 20" + year;
                break;
            case 7:
                result = "July, 20" + year;
                break;
            case 8:
                result = "August, 20" + year;
                break;
            case 9:
                result = "September, 20" + year;
                break;
            case 10:
                result = "October, 20" + year;
                break;
            case 11:
                result = "November, 20" + year;
                break;
            case 12:
                result = "December, 20" + year;
                break;    
            default:
                result = "Invalid month";
        }
        console.log(result);
       
    </script>
</body>
</html>
