<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <script>
        var num1 =40;
        if(num1>=18) {
            console.log("You are eligible to vote.");
        } else {
            console.log("You are not eligible to vote.");
        }


        let day = 2;
        switch(day) {
            case 1:
                console.log("Monday");
                break;
            case 2:
                console.log("Tuesday");
                break;
            case 3:
                console.log("Wednesday");
                break;
            case 4:
                console.log("Thursday");
                break;
            case 5:
                console.log("Friday");
                break;
            case 6:
                console.log("Saturday");
                break;
            case 7:
                console.log("Sunday");
                break;
            default:
                console.log("Invalid day.");
        }

        var a = 10;
        var b = 20;
        var c = 30;
        op1 = "+";
        op2 = "-";
        switch(true) {
            case (op1=="+" && op2=="-"):
                console.log(a+b-c);
                break;
            case (op1=="-" && op2=="+"):
                console.log(a-b+c);
                break;
            default:
                console.log("op1 is equal to op2");
        }

        var num2 = 16;
        if(num2>=90) {
            console.log("You got A grade.");
        } else if(num2>=80) {
            console.log("You got B grade.");
        } else if(num2>=70) {
            console.log("You got C grade.");
        } else if(num2>=60) {
            console.log("You got D grade.");
        } else {
            console.log("You failed the exam.");
        }





    </script>
    
</body>
</html>
