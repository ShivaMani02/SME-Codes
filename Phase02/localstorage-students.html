<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LocalStorage Student Records</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      background: #f4f7fb;
      padding: 30px 15px;
    }

    .card {
      border: none;
      border-radius: 18px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
    }

    .student-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      background: #fff;
    }

    .student-item:not(:last-child) {
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="card p-4 p-md-5">
          <h2 class="text-center mb-4">Student Registration</h2>

          <form id="studentForm">
            <div class="row g-3">
              <div class="col-md-4">
                <label for="name" class="form-label">Name</label>
                <input type="text" id="name" class="form-control" placeholder="Student name" required />
              </div>
              <div class="col-md-4">
                <label for="email" class="form-label">Email</label>
                <input type="email" id="email" class="form-control" placeholder="Email" required />
              </div>
              <div class="col-md-4">
                <label for="course" class="form-label">Course</label>
                <input type="text" id="course" class="form-control" placeholder="Course" required />
              </div>
            </div>

            <div class="d-grid mt-4">
              <button type="submit" class="btn btn-success">Register Student</button>
            </div>
          </form>

          <div id="message" class="mt-4 alert d-none" role="alert"></div>

          <h3 class="mt-4">Registered Students</h3>
          <ul id="studentList" class="list-unstyled mt-3"></ul>
        </div>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('studentForm');
    const messageBox = document.getElementById('message');
    const studentList = document.getElementById('studentList');
    const studentKey = 'students';

    function getStudents() {
      const data = localStorage.getItem(studentKey);
      return data ? JSON.parse(data) : [];
    }

    function saveStudents(students) {
      localStorage.setItem(studentKey, JSON.stringify(students));
    }

    function showMessage(text, type) {
      messageBox.textContent = text;
      messageBox.classList.remove('d-none', 'alert-success', 'alert-danger');
      messageBox.classList.add(type === 'success' ? 'alert-success' : 'alert-danger');
    }

    function renderStudents() {
      studentList.innerHTML = '';
      const students = getStudents();

      if (students.length === 0) {
        studentList.innerHTML = '<li class="text-muted">No students registered yet.</li>';
        return;
      }

      students.forEach((student, index) => {
        const li = document.createElement('li');
        li.className = 'student-item';

        const info = document.createElement('div');
        info.innerHTML = `<strong>${student.name}</strong><br><small>${student.email}</small><br><small>${student.course}</small>`;

        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'btn btn-outline-danger btn-sm';
        deleteBtn.textContent = 'Delete';

        deleteBtn.addEventListener('click', () => {
          const updatedStudents = getStudents();
          updatedStudents.splice(index, 1);
          saveStudents(updatedStudents);
          renderStudents();
          showMessage('Student deleted successfully.', 'success');
        });

        li.appendChild(info);
        li.appendChild(deleteBtn);
        studentList.appendChild(li);
      });
    }

    form.addEventListener('submit', function (event) {
      event.preventDefault();

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const course = document.getElementById('course').value.trim();
      const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

      if (!name || !email || !course) {
        showMessage('All fields are required.', 'error');
        return;
      }

      if (!emailPattern.test(email)) {
        showMessage('Please enter a valid email address.', 'error');
        return;
      }

      const students = getStudents();
      students.push({ name, email, course });
      saveStudents(students);

      form.reset();
      renderStudents();
      showMessage('Student registered successfully!', 'success');
    });

    renderStudents();
  </script>
</body>
</html>
